name: Rollback Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - prod
      release_id:
        description: "Release id to rollback to (example: v2026.03.05-1)"
        required: true
        type: string
      base_url:
        description: "Optional base URL override"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: pbth-rollback-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback-staging:
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [[ -n "${DEPLOY_HOST}" ]] || { echo "Missing secret: DEPLOY_HOST" >&2; exit 1; }
          [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "Missing secret: DEPLOY_SSH_KEY" >&2; exit 1; }

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Execute rollback on server
        env:
          TARGET_ENV: staging
          RELEASE_ID: ${{ inputs.release_id }}
          BASE_URL_INPUT: ${{ inputs.base_url }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          USER_NAME="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          ROOT_PATH="${DEPLOY_PATH:-/root/caldev}"
          if [[ -n "${BASE_URL_INPUT}" ]]; then
            BASE_URL="${BASE_URL_INPUT}"
          else
            BASE_URL="https://staging.pbthub.ru"
          fi

          ssh -p "${PORT}" -i ~/.ssh/id_ed25519 "${USER_NAME}@${DEPLOY_HOST}" \
            "cd ${ROOT_PATH} && ./scripts/rollback.sh '${TARGET_ENV}' '${RELEASE_ID}' '${BASE_URL}'"

      - name: Verify rollback target
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          BASE_URL_INPUT: ${{ inputs.base_url }}
        run: |
          if [[ -n "${BASE_URL_INPUT}" ]]; then
            BASE_URL="${BASE_URL_INPUT}"
          else
            BASE_URL="https://staging.pbthub.ru"
          fi
          curl -fsS "${BASE_URL}/api/v1/health" >/dev/null
          VERSION_JSON="$(curl -fsS "${BASE_URL}/api/v1/release/version")"
          echo "${VERSION_JSON}"
          echo "${VERSION_JSON}" | grep -q "\"releaseId\":\"${RELEASE_ID}\""

  rollback-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [[ -n "${DEPLOY_HOST}" ]] || { echo "Missing secret: DEPLOY_HOST" >&2; exit 1; }
          [[ -n "${DEPLOY_SSH_KEY}" ]] || { echo "Missing secret: DEPLOY_SSH_KEY" >&2; exit 1; }

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "${PORT}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Execute rollback on server
        env:
          TARGET_ENV: prod
          RELEASE_ID: ${{ inputs.release_id }}
          BASE_URL_INPUT: ${{ inputs.base_url }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          USER_NAME="${DEPLOY_USER:-root}"
          PORT="${DEPLOY_PORT:-22}"
          ROOT_PATH="${DEPLOY_PATH:-/root/caldev}"
          if [[ -n "${BASE_URL_INPUT}" ]]; then
            BASE_URL="${BASE_URL_INPUT}"
          elif [[ "${TARGET_ENV}" == "prod" ]]; then
            BASE_URL="https://pbthub.ru"
          else
            BASE_URL="https://staging.pbthub.ru"
          fi

          ssh -p "${PORT}" -i ~/.ssh/id_ed25519 "${USER_NAME}@${DEPLOY_HOST}" \
            "cd ${ROOT_PATH} && ./scripts/rollback.sh '${TARGET_ENV}' '${RELEASE_ID}' '${BASE_URL}'"

      - name: Verify rollback target
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          BASE_URL_INPUT: ${{ inputs.base_url }}
        run: |
          if [[ -n "${BASE_URL_INPUT}" ]]; then
            BASE_URL="${BASE_URL_INPUT}"
          else
            BASE_URL="https://pbthub.ru"
          fi
          curl -fsS "${BASE_URL}/api/v1/health" >/dev/null
          VERSION_JSON="$(curl -fsS "${BASE_URL}/api/v1/release/version")"
          echo "${VERSION_JSON}"
          echo "${VERSION_JSON}" | grep -q "\"releaseId\":\"${RELEASE_ID}\""
