name: CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pbth
          POSTGRES_USER: pbth
          POSTGRES_PASSWORD: pbth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: pbth
      DB_USER: pbth
      DB_PASSWORD: pbth
      TELEGRAM_BOT_TOKEN: 123456:dummy-token
      TELEGRAM_BOT_USERNAME: dummy_bot
      TELEGRAM_CALLBACK_URL: http://127.0.0.1:8000/api/v1/auth/telegram/callback
      SESSION_SECRET: test-secret
      ICS_TOKEN_SECRET: test-ics-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run db:migrate
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pbth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pbth/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  frontend-e2e:
    name: Frontend e2e (Playwright)
    # Playwright 1.58 не ставит Chromium на ubuntu-latest (26.04) — закреплено
    # 24.04, пока Playwright в pbth не обновлён до версии с поддержкой 26.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pbth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pbth/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Тесты в pbth/e2e подменяют ответы API в браузере (page.route), поэтому
      # им нужна только собранная статика: без базы и бэкенда.
      - name: Run e2e against built app
        run: |
          npx vite preview --host 127.0.0.1 --port 3000 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null || { cat preview.log; exit 1; }
          E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test

  api-smoke-contract:
    name: API contract smoke
    runs-on: ubuntu-latest
    needs:
      - backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pbth
          POSTGRES_USER: pbth
          POSTGRES_PASSWORD: pbth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEGRAM_BOT_TOKEN: 123456:dummy-token
      TELEGRAM_BOT_USERNAME: dummy_bot
      TELEGRAM_CALLBACK_URL: http://127.0.0.1:8000/api/v1/auth/telegram/callback
      SESSION_SECRET: test-secret
      ICS_TOKEN_SECRET: test-ics-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: pbth
      DB_USER: pbth
      DB_PASSWORD: pbth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Apply migrations
        working-directory: backend
        run: npm run db:migrate
      - name: Run API versioning smoke tests
        working-directory: backend
        run: npm run test:integration -- src/__tests__/integration/api-versioning.test.ts
