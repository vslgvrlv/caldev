name: CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pbth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pbth/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  api-smoke-contract:
    name: API contract smoke
    runs-on: ubuntu-latest
    needs:
      - backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Run API versioning smoke tests
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: 123456:dummy-token
          TELEGRAM_BOT_USERNAME: dummy_bot
          SESSION_SECRET: test-secret
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: pbth
          DB_USER: pbth
          DB_PASSWORD: pbth
        run: npm run test:integration -- src/__tests__/integration/api-versioning.test.ts
