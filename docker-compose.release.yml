services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.release
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_ROLE_ALLOWLIST_USERNAMES: ${ADMIN_ROLE_ALLOWLIST_USERNAMES:-}
      ADMIN_ROLE_ALLOWLIST_IDS: ${ADMIN_ROLE_ALLOWLIST_IDS:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-0}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-pbth.sid}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_API_BASE_URL: ${TELEGRAM_BOT_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      AUTH_YANDEX_ENABLED: ${AUTH_YANDEX_ENABLED:-0}
      YANDEX_OAUTH_CLIENT_ID: ${YANDEX_OAUTH_CLIENT_ID:-}
      YANDEX_OAUTH_CLIENT_SECRET: ${YANDEX_OAUTH_CLIENT_SECRET:-}
      YANDEX_OAUTH_REDIRECT_URI: ${YANDEX_OAUTH_REDIRECT_URI:-}
      YANDEX_OAUTH_LINK_REDIRECT_URI: ${YANDEX_OAUTH_LINK_REDIRECT_URI:-}
      TELEGRAM_CALLBACK_URL: ${TELEGRAM_CALLBACK_URL}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_MAX_AUTH_AGE_SEC: ${TELEGRAM_MAX_AUTH_AGE_SEC:-86400}
      AUTH_TELEGRAM_HANDOFF_ENABLED: ${AUTH_TELEGRAM_HANDOFF_ENABLED:-1}
      AUTH_TELEGRAM_HANDOFF_ATTEMPT_TTL_SEC: ${AUTH_TELEGRAM_HANDOFF_ATTEMPT_TTL_SEC:-1800}
      AUTH_TELEGRAM_HANDOFF_TOKEN_TTL_SEC: ${AUTH_TELEGRAM_HANDOFF_TOKEN_TTL_SEC:-600}
      AUTH_OIDC_ENABLED: ${AUTH_OIDC_ENABLED:-0}
      AUTH_OIDC_FALLBACK_ENABLED: ${AUTH_OIDC_FALLBACK_ENABLED:-1}
      AUTH_OIDC_ADMIN_REQUIRED: ${AUTH_OIDC_ADMIN_REQUIRED:-0}
      AUTH_OIDC_CANARY_PERCENT: ${AUTH_OIDC_CANARY_PERCENT:-100}
      AUTH_OIDC_CANARY_COOKIE: ${AUTH_OIDC_CANARY_COOKIE:-pbth.oidc.canary}
      AUTH_OIDC_CANARY_COOKIE_MAX_AGE_SEC: ${AUTH_OIDC_CANARY_COOKIE_MAX_AGE_SEC:-2592000}
      TELEGRAM_OIDC_CLIENT_ID: ${TELEGRAM_OIDC_CLIENT_ID:-}
      TELEGRAM_OIDC_CLIENT_SECRET: ${TELEGRAM_OIDC_CLIENT_SECRET:-}
      TELEGRAM_OIDC_REDIRECT_URI: ${TELEGRAM_OIDC_REDIRECT_URI:-}
      TELEGRAM_OIDC_ISSUER: ${TELEGRAM_OIDC_ISSUER:-https://oauth.telegram.org}
      TELEGRAM_OIDC_JWKS_URL: ${TELEGRAM_OIDC_JWKS_URL:-https://oauth.telegram.org/.well-known/jwks.json}
      TELEGRAM_OIDC_AUTHORIZE_URL: ${TELEGRAM_OIDC_AUTHORIZE_URL:-https://oauth.telegram.org/auth}
      TELEGRAM_OIDC_TOKEN_URL: ${TELEGRAM_OIDC_TOKEN_URL:-https://oauth.telegram.org/token}
      AUTH_OIDC_STATE_TTL_SEC: ${AUTH_OIDC_STATE_TTL_SEC:-600}
      AUTH_OIDC_CLOCK_SKEW_SEC: ${AUTH_OIDC_CLOCK_SKEW_SEC:-60}
      ICS_TOKEN_SECRET: ${ICS_TOKEN_SECRET}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Moscow}
      ICS_RECURRING_WINDOW_DAYS: ${ICS_RECURRING_WINDOW_DAYS:-45}
      RATE_AUTH_WINDOW_MS: ${RATE_AUTH_WINDOW_MS:-60000}
      RATE_AUTH_MAX: ${RATE_AUTH_MAX:-20}
      RATE_WRITE_WINDOW_MS: ${RATE_WRITE_WINDOW_MS:-60000}
      RATE_WRITE_MAX: ${RATE_WRITE_MAX:-120}
      NOTIFICATIONS_QUEUE_ENABLED: ${NOTIFICATIONS_QUEUE_ENABLED:-0}
      NOTIFICATIONS_QUEUE_CONCURRENCY: ${NOTIFICATIONS_QUEUE_CONCURRENCY:-5}
      NOTIFICATIONS_QUEUE_RETRY_LIMIT: ${NOTIFICATIONS_QUEUE_RETRY_LIMIT:-4}
      NOTIFICATIONS_QUEUE_RETRY_DELAY_SECONDS: ${NOTIFICATIONS_QUEUE_RETRY_DELAY_SECONDS:-20}
      DEV_AUTH_ENABLED: ${DEV_AUTH_ENABLED:-0}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-}
      AUTH_SLO_ENABLED: ${AUTH_SLO_ENABLED:-1}
      AUTH_SLO_WINDOW_MINUTES: ${AUTH_SLO_WINDOW_MINUTES:-60}
      AUTH_SLO_MIN_ATTEMPTS: ${AUTH_SLO_MIN_ATTEMPTS:-20}
      AUTH_SLO_MAX_ERROR_RATE: ${AUTH_SLO_MAX_ERROR_RATE:-0.1}
      AUTH_SLO_TOKEN: ${AUTH_SLO_TOKEN:-}
      RELEASE_ID: ${RELEASE_ID:-dev}
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
      RELEASE_BUILT_AT: ${RELEASE_BUILT_AT:-unknown}
    depends_on:
      - db

  frontend:
    build:
      context: ./pbth
      dockerfile: Dockerfile
      args:
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
        VITE_AUTH_YANDEX_ENABLED: ${VITE_AUTH_YANDEX_ENABLED:-0}
    restart: unless-stopped
    environment:
      VITE_BACKEND_TARGET: http://backend:8000
      VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
      VITE_AUTH_YANDEX_ENABLED: ${VITE_AUTH_YANDEX_ENABLED:-0}
    depends_on:
      - backend

volumes:
  pgdata:
