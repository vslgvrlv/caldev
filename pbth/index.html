<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0F0F" />
    <meta name="description" content="PaintBall Team Hub — управление пейнтбольной командой: расписание, RSVP, финансы и состав в одном месте." />
    <meta name="robots" content="index,follow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PBTH" />
    <link rel="canonical" href="https://pbthub.ru/" />
    <!-- Фон главной (элемент LCP) живёт на Unsplash: соединение открываем заранее, пока грузится JS. -->
    <link rel="preconnect" href="https://images.unsplash.com" />
    <script>
      // Предзагрузка фона главной (personal-os#1431): без неё картинка ждёт,
      // пока скачается и выполнится JS. Только для "/" — в приложении фона нет.
      // Набор ширин совпадает с HERO_IMAGE_WIDTHS в views/LandingView.tsx.
      (function () {
        if (location.pathname !== '/') return;
        var base = 'https://images.unsplash.com/photo-1552083974-186346191183?q=60&auto=format&fit=crop';
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.setAttribute('imagesrcset', [640, 828, 1080, 1440, 2070].map(function (w) { return base + '&w=' + w + ' ' + w + 'w'; }).join(', '));
        link.setAttribute('imagesizes', '100vw');
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaintBall Team Hub" />
    <meta property="og:title" content="PaintBall Team Hub" />
    <meta property="og:description" content="Единый хаб для капитанов и игроков: события, участники, напоминания и финансы команды." />
    <meta property="og:url" content="https://pbthub.ru/" />
    <meta property="og:image" content="https://pbthub.ru/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaintBall Team Hub" />
    <meta name="twitter:description" content="Управление пейнтбольной командой в одном приложении." />
    <meta name="twitter:image" content="https://pbthub.ru/og-image.png" />

    <title>PaintBall Team Hub</title>

    <!-- Tailwind is bundled into the Vite build; CSS arrives via index.tsx. -->
    <!-- Telegram WebApp SDK still loads runtime via vendor proxy (we cannot bundle Telegram's CDN script reliably). -->
    <script>
      (function () {
        var src = "/api/v1/vendor/telegram-web-app.js?v=20260510-1";
        var existing = document.querySelector('script[data-pbth-vendor="' + src + '"]');
        if (existing) return;
        var script = document.createElement("script");
        script.src = src;
        script.defer = true;
        script.setAttribute("data-pbth-vendor", src);
        document.head.appendChild(script);
      })();
    </script>

    <style>
      /* Pre-paint background so the page is dark even before the bundled CSS lands. */
      html, body { margin: 0; min-height: 100%; background-color: #0F0F0F; color: #FFFFFF; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
