<html lang="ru" class="dark">

    <meta charset="utf-8" />

    <meta name="theme-color" content="#0F0F0F" />

    <meta name="robots" content="index,follow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PBTH" />
    <link rel="canonical" href="https://pbthub.ru/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaintBall Team Hub" />
    <meta property="og:title" content="PaintBall Team Hub" />
    <meta property="og:description" content="Единый хаб для капитанов и игроков: события, участники, напоминания и финансы команды." />
    <meta property="og:url" content="https://pbthub.ru/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaintBall Team Hub" />
    <meta name="twitter:description" content="Управление пейнтбольной командой в одном приложении." />
    <meta name="twitter:image" content="https://pbthub.ru/og-image.png" />

    <title>PaintBall Team Hub</title>

    <link rel="stylesheet" href="/pb-theme-fallback.css?v=20260304-1" />
    <script src="/tailwind.runtime.config.js?v=20260304-1"></script>
    <script>
      (function () {
        var vendorScripts = [
          "/api/v1/vendor/tailwindcss.js?v=20260304-1",
          "/api/v1/vendor/telegram-web-app.js?v=20260304-1",
        ];

        vendorScripts.forEach(function (src) {
          var existing = document.querySelector('script[data-pbth-vendor="' + src + '"]');
          if (existing) return;

          var script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.setAttribute("data-pbth-vendor", src);
          document.head.appendChild(script);
        });
      })();
    </script>

    <style>
      :root {
        --pb-safe-top: env(safe-area-inset-top, 0px);
        --pb-safe-right: env(safe-area-inset-right, 0px);
        --pb-safe-bottom: env(safe-area-inset-bottom, 0px);
        --pb-safe-left: env(safe-area-inset-left, 0px);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #0F0F0F;
      }

      body,
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #0F0F0F;
        color: #FFFFFF;
        -webkit-tap-highlight-color: transparent;
      }

      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }

      .pb-safe {
        padding-bottom: var(--pb-safe-bottom);
      }

      .pb-safe-top {
        padding-top: var(--pb-safe-top);
      }

      .pb-safe-x {
        padding-left: var(--pb-safe-left);
        padding-right: var(--pb-safe-right);
      }

      .pb-safe-screen {
        padding-top: var(--pb-safe-top);
        padding-right: var(--pb-safe-right);
        padding-bottom: var(--pb-safe-bottom);
        padding-left: var(--pb-safe-left);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
